<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2AIO — 調査 → 計画 → 実装 → テスト → Push</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>

<header>
  <div class="brand">2AIO <span>フェーズ実行</span></div>
  <div class="goal" id="goal"></div>
  <div class="branch" id="branch"></div>
</header>

<div class="shell">

  <nav class="rail" id="rail" aria-label="フェーズ">
    <div class="rail-head">フェーズ</div>
    <div id="steps"></div>
    <p class="rail-note">
      各行の下段は、そのフェーズで<strong>実際に強制されている</strong>権限。
      範囲外のツールは承認カードになり、人間が答えるまで停止する。
    </p>
  </nav>

  <div class="center">
    <main class="stream" id="stream">
      <div class="thread" id="thread" aria-live="polite" aria-relevant="additions"></div>
    </main>

    <footer>
      <div class="dock">
        <div class="gate" id="gate" hidden></div>
        <form class="composer" id="composer">
          <textarea id="input" rows="1" placeholder="作りたいもの・直したいことを1行で… (Enter で送信 / Shift+Enter で改行)"></textarea>
          <button class="btn btn-primary" id="send" type="submit">調査を開始</button>
        </form>
      </div>
    </footer>
  </div>

  <aside class="panel" id="panel" hidden aria-label="成果物">
    <div class="panel-head">
      <span class="name" id="panel-name"></span>
      <button class="btn btn-sm btn-quiet" id="panel-close" type="button">閉じる</button>
    </div>
    <div id="push-box"></div>
    <pre class="panel-body" id="panel-body"></pre>
  </aside>

</div>

<script type="module" src="/app.js"></script>
</body>
</html>
